# Monorepo deploy: include backend + support-deck (+ pulse for weekly).
# Set Railway Root Directory to `/` (repo root) and Config File to `/railway.toml`.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
